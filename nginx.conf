server {
    listen 80;
    server_name time.to.go.xn--80a6ad.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name time.to.go.xn--80a6ad.space;

    ssl_certificate /etc/letsencrypt/live/time.to.go.xn--80a6ad.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/time.to.go.xn--80a6ad.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache entry points — must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Hashed assets are safe to cache long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
}
